name: Cinevo quality and security

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinevo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and scan source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prevent public signing-key leaks
        run: node scripts/check-public-repo.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
